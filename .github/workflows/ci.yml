name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Mypy follows the optional renderer imports, so its type package must be installed even
      # though CI does not download a browser binary or run an export.
      - run: python -m pip install --disable-pip-version-check -e './backend[dev,renderer]'
      - run: ruff check backend scripts
      - run: mypy backend/koalabattle
      # The floor must be passed on the command line: pytest-cov ignores `fail_under`
      # in pyproject.toml. `make coverage` uses the same value.
      - run: pytest -q backend/tests/unit --cov=koalabattle --cov-fail-under=70
      - run: python scripts/check_docs.py
      # Campaign team validation moved to the `showdown-integration` job, which runs
      # it together with the rest of the integration suite instead of twice.

  # Real battles against the pinned Showdown server. Kept out of the `backend` job
  # because it takes minutes, but it is the only thing that exercises the engine's
  # protocol bridge — the part no unit test can reach.
  showdown-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e './backend[dev]'
      - name: Start the pinned Showdown server and validator
        run: docker compose up -d --build --wait showdown team-validator
      # Edge speech is excluded on purpose: it calls an unofficial online service
      # with no availability guarantee, so it would make CI fail for weather.
      - name: Run Showdown integration tests
        env:
          KOALABATTLE_RUN_SHOWDOWN_TEST: "1"
          KOALABATTLE_SHOWDOWN_WEBSOCKET_URL: ws://127.0.0.1:8000/showdown/websocket
          KOALABATTLE_TEAM_VALIDATOR_URL: http://127.0.0.1:8002
        run: >-
          pytest -q backend/tests/integration
          --ignore=backend/tests/integration/test_edge_speech.py
      - name: Stop Showdown
        if: always()
        run: docker compose down

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: python scripts/setup_assets.py status
      - run: python scripts/setup_sfx.py status
      - run: python scripts/setup_move_effects.py status
