name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Mypy follows the optional renderer imports, so its type package must be installed even
      # though CI does not download a browser binary or run an export.
      - run: python -m pip install --disable-pip-version-check -e './backend[dev,renderer]'
      - run: ruff check backend scripts
      - run: mypy backend/koalabattle
      - run: pytest -q backend/tests/unit
      - run: python scripts/check_docs.py
      - name: Start pinned Showdown validators
        run: docker compose up -d --build --wait team-validator
      - name: Validate Challenge campaign teams
        env:
          KOALABATTLE_RUN_SHOWDOWN_TEST: "1"
        run: pytest -q backend/tests/integration/test_challenge_content.py
      - name: Stop pinned Showdown validators
        if: always()
        run: docker compose down

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: python scripts/setup_assets.py status
      - run: python scripts/setup_sfx.py status
      - run: python scripts/setup_move_effects.py status
