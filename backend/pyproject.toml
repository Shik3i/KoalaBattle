[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "koalabattle"
version = "0.11.0"
description = "Event-sourced AI battle production suite"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "anthropic==0.119.0",
  "edge-tts==7.2.8",
  "fastapi==0.139.2",
  "google-genai==2.13.0",
  "openai==2.46.0",
  "orjson==3.11.6",
  "poke-env==0.15.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.12.8",
]
renderer = ["playwright==1.62.0"]

[tool.hatch.build.targets.wheel]
packages = ["koalabattle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a running local Pokemon Showdown server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["koalabattle"]
branch = true

[tool.coverage.report]
# The floor is enforced with `--cov-fail-under=70` by CI and `make coverage`, not
# here: pytest-cov does not act on this file's `fail_under`, so a value set here
# alone reads like a gate while letting any coverage through. Verified by setting
# it to 99 and watching the run still pass.
#
# 70 sits a little below the current ~74%: high enough to catch a module losing
# its tests, low enough not to fail for noise. What is uncovered needs
# infrastructure the unit job does not have — video export wants Chromium and
# FFmpeg, providers want API keys, the Showdown engine wants a running server —
# and the integration jobs exercise it instead.
skip_covered = true
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
