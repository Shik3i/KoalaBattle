services:
  showdown:
    image: koalabattle-showdown:local
    build:
      context: .
      dockerfile: showdown/Dockerfile
      args:
        SHOWDOWN_COMMIT: b22742debfdce6e640193384f5731b9030f9cb6e
    ports:
      - "${KOALABATTLE_BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  team-validator:
    image: koalabattle-showdown:local
    command: ["node", "team-validator-server.js"]
    ports:
      - "${KOALABATTLE_BIND_HOST:-127.0.0.1}:8002:8002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      showdown:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      KOALABATTLE_DATABASE_URL: sqlite+aiosqlite:////data/koalabattle.db
      KOALABATTLE_SHOWDOWN_WEBSOCKET_URL: ws://showdown:8000/showdown/websocket
      KOALABATTLE_SHOWDOWN_AUTH_URL: https://play.pokemonshowdown.com/action.php?
      KOALABATTLE_TEAM_VALIDATOR_URL: http://team-validator:8002
      KOALABATTLE_ORCHESTRATOR_LOCAL_BASE_URL: ${KOALABATTLE_ORCHESTRATOR_LOCAL_BASE_URL:-http://host.docker.internal:1234/v1}
      KOALABATTLE_ORCHESTRATOR_DEFAULT_MODEL: ${KOALABATTLE_ORCHESTRATOR_DEFAULT_MODEL:-google/gemma-4-e4b}
      KOALABATTLE_CORS_ORIGINS: http://localhost:${KOALABATTLE_FRONTEND_PORT:-3000},http://localhost:5173,http://frontend:3000
      # Empty by default = no authentication, which is fine while everything stays on
      # 127.0.0.1. Set it in .env before binding to anything wider, and enter the same
      # value under Settings -> Operator access in the browser.
      KOALABATTLE_API_TOKEN: ${KOALABATTLE_API_TOKEN:-}
      KOALABATTLE_ASSET_ROOT: /assets
      KOALABATTLE_OPENAI_API_KEY: ${KOALABATTLE_OPENAI_API_KEY:-}
      KOALABATTLE_GEMINI_API_KEY: ${KOALABATTLE_GEMINI_API_KEY:-}
      KOALABATTLE_ANTHROPIC_API_KEY: ${KOALABATTLE_ANTHROPIC_API_KEY:-}
      KOALABATTLE_DEEPSEEK_API_KEY: ${KOALABATTLE_DEEPSEEK_API_KEY:-}
      KOALABATTLE_OPENAI_COMPATIBLE_API_KEY: ${KOALABATTLE_OPENAI_COMPATIBLE_API_KEY:-}
      KOALABATTLE_PROVIDER_CREDENTIALS_FILE: /runtime-config/provider-credentials.env
      KOALABATTLE_ENABLE_FAKE_PROVIDER: ${KOALABATTLE_ENABLE_FAKE_PROVIDER:-false}
      KOALABATTLE_MAX_CONCURRENT_MATCHES: ${KOALABATTLE_MAX_CONCURRENT_MATCHES:-2}
      KOALABATTLE_PRICING_VERSION: ${KOALABATTLE_PRICING_VERSION:-unconfigured}
      KOALABATTLE_PRICING_TABLE_JSON: ${KOALABATTLE_PRICING_TABLE_JSON:-{}}
      KOALABATTLE_SPEECH_PROVIDER: ${KOALABATTLE_SPEECH_PROVIDER:-qwen-local}
      KOALABATTLE_SPEECH_AUDIO_ROOT: /data/audio
      KOALABATTLE_SPEECH_QWEN_BASE_URL: ${KOALABATTLE_SPEECH_QWEN_BASE_URL:-http://host.docker.internal:8890/v1}
      KOALABATTLE_SPEECH_QWEN_ENDPOINT: ${KOALABATTLE_SPEECH_QWEN_ENDPOINT:-/audio/speech}
      KOALABATTLE_SPEECH_QWEN_MODEL: ${KOALABATTLE_SPEECH_QWEN_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      KOALABATTLE_SPEECH_QWEN_API_KEY: ${KOALABATTLE_SPEECH_QWEN_API_KEY:-}
      KOALABATTLE_SPEECH_QWEN_REFERENCE_ROOT: /data/audio/voices
      KOALABATTLE_SPEECH_QWEN_TIMEOUT_SECONDS: ${KOALABATTLE_SPEECH_QWEN_TIMEOUT_SECONDS:-300}
      KOALABATTLE_SPEECH_QWEN_MAX_RETRIES: ${KOALABATTLE_SPEECH_QWEN_MAX_RETRIES:-1}
      KOALABATTLE_SPEECH_QWEN_MAX_CONCURRENCY: ${KOALABATTLE_SPEECH_QWEN_MAX_CONCURRENCY:-1}
      KOALABATTLE_SPEECH_EDGE_ENABLED: ${KOALABATTLE_SPEECH_EDGE_ENABLED:-true}
      KOALABATTLE_SPEECH_EDGE_VOICE_P1: ${KOALABATTLE_SPEECH_EDGE_VOICE_P1:-en-US-EmmaMultilingualNeural}
      KOALABATTLE_SPEECH_EDGE_VOICE_P2: ${KOALABATTLE_SPEECH_EDGE_VOICE_P2:-en-US-BrianMultilingualNeural}
      KOALABATTLE_SPEECH_EDGE_VOICE_NARRATOR: ${KOALABATTLE_SPEECH_EDGE_VOICE_NARRATOR:-en-US-GuyNeural}
      KOALABATTLE_SPEECH_MAX_CONCURRENCY: ${KOALABATTLE_SPEECH_MAX_CONCURRENCY:-8}
      KOALABATTLE_SPEECH_MAX_TEXT_CHARACTERS: ${KOALABATTLE_SPEECH_MAX_TEXT_CHARACTERS:-1000}
      KOALABATTLE_SPEECH_OPENAI_MODEL: ${KOALABATTLE_SPEECH_OPENAI_MODEL:-gpt-4o-mini-tts}
      KOALABATTLE_SPEECH_OPENAI_BASE_URL: ${KOALABATTLE_SPEECH_OPENAI_BASE_URL:-}
      KOALABATTLE_SPEECH_OPENAI_API_KEY: ${KOALABATTLE_SPEECH_OPENAI_API_KEY:-}
      KOALABATTLE_VIDEO_ROOT: /data/videos
      # The API image intentionally has no Chromium/Playwright. Keep export work on the
      # renderer profile; otherwise both services race to claim the same SQLite queue.
      KOALABATTLE_VIDEO_WORKER_ENABLED: ${KOALABATTLE_VIDEO_WORKER_ENABLED:-false}
      KOALABATTLE_VIDEO_MAX_CONCURRENCY: ${KOALABATTLE_VIDEO_MAX_CONCURRENCY:-1}
      KOALABATTLE_VIDEO_FRAME_WORKERS: ${KOALABATTLE_VIDEO_FRAME_WORKERS:-4}
      KOALABATTLE_VIDEO_FRONTEND_URL: http://frontend:3000
      KOALABATTLE_VIDEO_API_URL: http://backend:8001
    volumes:
      - ./data:/data
      - ./data/assets:/assets:ro
      - type: bind
        source: ./data/provider-credentials.env
        target: /runtime-config/provider-credentials.env
        read_only: false
        bind:
          create_host_path: false
    ports:
      - "${KOALABATTLE_BIND_HOST:-127.0.0.1}:8001:8001"
    depends_on:
      showdown:
        condition: service_healthy
      team-validator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PUBLIC_API_URL: http://localhost:8001
      PUBLIC_WS_URL: ws://localhost:8001
      PUBLIC_RENDER_API_URL: http://backend:8001
      ORIGIN: http://localhost:${KOALABATTLE_FRONTEND_PORT:-3000}
    ports:
      - "${KOALABATTLE_BIND_HOST:-127.0.0.1}:${KOALABATTLE_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  renderer:
    profiles: ["renderer"]
    build:
      context: .
      dockerfile: Dockerfile.renderer
    environment:
      KOALABATTLE_DATABASE_URL: sqlite+aiosqlite:////data/koalabattle.db
      KOALABATTLE_ASSET_ROOT: /assets
      KOALABATTLE_SPEECH_AUDIO_ROOT: /data/audio
      KOALABATTLE_VIDEO_ROOT: /data/videos
      KOALABATTLE_VIDEO_WORKER_ENABLED: "true"
      KOALABATTLE_VIDEO_MAX_CONCURRENCY: ${KOALABATTLE_VIDEO_MAX_CONCURRENCY:-1}
      KOALABATTLE_VIDEO_FRAME_WORKERS: ${KOALABATTLE_VIDEO_FRAME_WORKERS:-4}
      KOALABATTLE_VIDEO_FRONTEND_URL: http://frontend:3000
      KOALABATTLE_VIDEO_API_URL: http://backend:8001
      KOALABATTLE_VIDEO_FFMPEG_PATH: /usr/bin/ffmpeg
      KOALABATTLE_VIDEO_FFPROBE_PATH: /usr/bin/ffprobe
      KOALABATTLE_VIDEO_CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - ./data:/data
      - ./data/assets:/assets:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    init: true
    restart: unless-stopped
